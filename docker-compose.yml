name: cinetrace

# 部署前先准备环境变量文件（必需）：
#   cp .env.example .env
# 群晖 Container Manager 用户：把本文件内容整段粘贴进「项目」的 compose 输入框即可，
# 但 .env 需要提前放到与本文件同一目录，否则 compose 会因找不到 env_file 报错。
#
# 首次部署（数据库为空）时，容器日志会打印自动生成的初始账号与密码，查看方式：
#   docker compose logs web | grep -A 5 初始账号
#
# 构建卡在 apt / npm / 下载字体（Unable to connect / Failed to fetch）时，
# 在 .env 里填上 HTTP_PROXY 与 HTTPS_PROXY（NAS 上跑 Docker 时用宿主机局域网 IP，
# 不能写 127.0.0.1），然后重新构建：docker compose build --no-cache && docker compose up -d

x-app: &app
  build:
    context: .
    # 构建期代理（apt / npm / 下载字体都走它）。值取自 .env，留空即直连。
    # 注意：必须写在 build.args 里才对 docker build 生效，写在 environment 里无效。
    args:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
  image: cinetrace:local
  restart: unless-stopped
  env_file:
    - .env
  environment:
    # 容器内固定指向挂载卷，宿主机上的 .env 不需要关心容器路径
    DATABASE_PATH: /data/cinetrace.db
    ARCHIVE_DIR: /data/archive
    TZ: ${TZ:-Asia/Shanghai}
    # 运行期代理（抓取豆瓣时用），同样留空即直连
    HTTP_PROXY: ${HTTP_PROXY:-}
    HTTPS_PROXY: ${HTTPS_PROXY:-}
    # 内网与本机地址不走代理
    NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1}
  volumes:
    # 数据库与原始归档都落在这个卷里，换容器不丢数据
    - cinetrace-data:/data
    # 群晖若想把数据直接放在 NAS 目录下，改用下一行（先在 File Station 建好目录）：
    # - /volume1/docker/cinetrace/data:/data

services:
  web:
    <<: *app
    command: npm run start
    ports:
      # 左侧是 NAS 上的访问端口，冲突时改 .env 里的 WEB_PORT
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      # 首次启动要跑迁移与构建产物预热，给足时间避免被误判为不健康
      start_period: 40s

  worker:
    <<: *app
    command: npm run worker
    depends_on:
      # 等 web 起来说明迁移已完成，worker 无需抢跑
      web:
        condition: service_healthy

volumes:
  cinetrace-data:
